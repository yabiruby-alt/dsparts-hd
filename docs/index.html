<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>동성모터스 PARTS — 종료 안내</title>
<style>
  :root { --bg:#f3f4f6; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#d1d5db; --accent:#1c69d4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#f3f4f6; --sub:#9ca3af; --line:#2f3440; --accent:#6ea8ff; } }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .box { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:26px 22px; }
  h1 { font-size:17px; margin:0 0 10px; }
  p { margin:0 0 12px; font-size:14px; line-height:1.6; color:var(--sub); }
  a.go { display:block; margin-top:18px; text-align:center; font-size:15px; padding:12px; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <h1>지점 상세 화면은 종료되었습니다</h1>
  <p>이 주소의 지점 대시보드는 2026년 11월 5일로 운영을 마쳤습니다.</p>
  <p>같은 내용은 <b>통합 대시보드</b>의 「지점관리」 메뉴에서 같은 계정으로 볼 수 있습니다.</p>
  <a class="go" href="https://dsm-stats.pages.dev/">통합 대시보드로 가기</a>
</div>
</body>
</html>
